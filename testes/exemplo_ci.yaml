name: CI / Shift-Left 🛡️ Kvalitetskontroll (QA Pipeline)

on:
  push:
    branches: ["dev.*", "main"]
  pull_request:
    branches: ["dev.*", "main"]

jobs:
  static-analysis:
    name: "Lints & Tipos (Análise Estática Máxima)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Prettier / Linter
        run: npm run lint

      - name: TypeScript Strict Check
        run: npx tsc --noEmit

  unit-test:
    name: "Testes Unitários da Aplicação (Vitest)"
    needs: [static-analysis]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest / Código Isolado
        run: npm run test

  e2e-playwright:
    name: "Testes Funcionais (E2E)"
    needs: [static-analysis] # Opcional: Desencadear só após unidade. Retirando para paralelismo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build do E2E
        run: npm run build

      - name: Run Playwright Tests (Smoke + Regression)
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

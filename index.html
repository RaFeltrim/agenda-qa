
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#4f46e5">
    <title>Agenda Kanban v3.0 | AI Workspace</title>
    
    <!-- Favicon dinâmico (SVG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mesh-color: rgba(99, 102, 241, 0.03);
        }
        body {
            font-family: 'Inter', sans-serif;
            scroll-behavior: smooth;
            background-image: 
                radial-gradient(at 0% 0%, var(--mesh-color) 0, transparent 50%), 
                radial-gradient(at 50% 0%, rgba(20, 184, 166, 0.03) 0, transparent 50%);
            -webkit-tap-highlight-color: transparent;
        }
        .dark body {
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.07) 0, transparent 50%), 
                radial-gradient(at 100% 100%, rgba(20, 184, 166, 0.07) 0, transparent 50%);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e8f0;
            border-radius: 10px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #334155;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1;
        }
        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass {
            background: rgba(15, 23, 42, 0.7);
        }
    </style>
